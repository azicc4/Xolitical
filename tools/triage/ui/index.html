<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xolitical Triage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Xolitical <span>triage</span></div>
  <div id="progress" class="progress">loading…</div>
  <div class="alias">adding as <b id="alias">…</b></div>
</header>

<main id="main" hidden>
  <section class="preview">
    <div id="preview-box" class="preview-box"></div>
    <div class="filemeta">
      <code id="filename"></code>
      <span id="filesize"></span>
    </div>
  </section>

  <section class="form">
    <label>Title
      <input id="f-title" type="text" placeholder="short label for the item">
    </label>

    <label>Description
      <textarea id="f-desc" rows="4" placeholder="what is this, why does it matter"></textarea>
    </label>

    <label>Source URL
      <input id="f-source" type="url" placeholder="https://…  (required when one exists)">
    </label>

    <div class="row">
      <label>Platform
        <select id="f-platform">
          <option value="twitter">twitter</option>
          <option value="instagram">instagram</option>
          <option value="youtube">youtube</option>
          <option value="substack">substack</option>
          <option value="other">other</option>
        </select>
      </label>
      <label>Type
        <select id="f-type">
          <option value="image">image</option>
          <option value="video">video</option>
          <option value="pdf">pdf</option>
          <option value="text">text</option>
          <option value="other">other</option>
        </select>
      </label>
      <label>Account
        <input id="f-account" type="text" placeholder="handle">
      </label>
      <label>Date posted
        <input id="f-date" type="date">
      </label>
    </div>

    <label>Tags
      <input id="tag-filter" type="text" placeholder="filter tags, or type a new one and press Enter">
    </label>
    <div id="tag-chips" class="chips"></div>

    <div class="actions">
      <button id="btn-save" class="primary" title="Ctrl+Enter">Save → vault</button>
      <button id="btn-skip" title="Alt+S">Skip for now</button>
      <button id="btn-dupe" class="danger" title="move to unsorted/_duplicates">Mark duplicate</button>
    </div>
    <div id="status" class="status"></div>
  </section>
</main>

<div id="empty" class="empty" hidden>
  <h1>Queue clear 🎉</h1>
  <p>Nothing left in <code id="unsorted-path"></code>.<br>Drop more files in and refresh.</p>
</div>

<dialog id="dupe-dialog">
  <h2>Duplicate detected</h2>
  <p id="dupe-msg"></p>
  <div class="actions">
    <button id="dupe-move" class="danger">Move to _duplicates</button>
    <button id="dupe-force">Save anyway</button>
    <button id="dupe-cancel">Cancel</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
